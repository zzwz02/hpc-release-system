# remote-test.yaml 的模板
# 适合直接复制并按需修改。字段名应保持不变，注释仅用于解释字段用途。
# 如果想看字段逐项解释，请阅读 remote-test-yaml-guide.md。
# 如果想从“另一个 skill 如何接入”角度检查准备项，请阅读 integration-checklist.md。

# 当前被测试的 skill 或功能名称
skill_name: my-new-skill

sync:
  # 需要从本地同步到远程宿主机的路径列表
  local_paths:
    - .

  # 同步时需要排除的路径
  exclude:
    - .git
    - __pycache__
    - .remote-test-jobs

  # 远程宿主机上的工作目录
  # 代码会先同步到这里，容器通常再挂载这个目录
  remote_workspace: /home/dev/work/my-new-skill

  # 文件传输方式，通常优先 rsync
  transfer: rsync

execution:
  # 执行位置：
  # container = 在容器内执行
  # host = 在宿主机执行
  target: container

  # 长任务建议通过 tmux 托管
  use_tmux: true

  # 远程测试服务器地址
  host: 10.0.0.8

  # SSH 连接端口
  # 如果服务器不是默认的 22 端口，需要在这里显式指定
  port: 22

  # SSH 用户名
  user: dev

  # 认证模式
  # ssh_key = 使用 SSH key，推荐
  # password_env = 从环境变量读取密码
  # password_prompt = 运行时提示输入密码
  # password_inline 在本项目被拒绝；不能将密码写在配置中
  auth_mode: ssh_key

  # 当 auth_mode=ssh_key 时可选
  # 如不填写，则使用系统默认 SSH key
  private_key_path: ~/.ssh/id_rsa

  # 当 auth_mode=password_env 时可选
  # 默认值为 REMOTE_ASYNC_EXECUTOR_PASSWORD
  password_env_var: REMOTE_ASYNC_EXECUTOR_PASSWORD

  # 不配置 password 字段；密码只通过 password_env_var 指定的环境变量提供

  # 远程使用的 shell
  shell: bash

  # 宿主机工作目录
  # 一般与 sync.remote_workspace 保持一致
  workdir: /home/dev/work/my-new-skill

  # 预估超时时长，仅作为提示信息
  timeout_hint_sec: 1800

container:
  # 当 execution.target=container 时必填
  # 容器名称或容器 ID
  name: my-dev-container

  # 容器内工作目录
  # 应与宿主机 remote_workspace 的挂载路径一致
  workdir: /workspace/my-new-skill

test:
  # 远程实际执行的测试命令
  # 必须写成明确、可执行的命令
  command: bash scripts/test.sh

artifacts:
  # 测试结束后需要回收的业务产物路径
  # 一般写成相对路径
  # job 目录下的 stdout.log / stderr.log 会由框架自动回收，无需在这里声明
  - logs/test.log
  - reports/result.json
